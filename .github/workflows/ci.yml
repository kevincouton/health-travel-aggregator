name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: health_travel
          POSTGRES_PASSWORD: health_travel
          POSTGRES_DB: health_travel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: ./service
    env:
      DATABASE_URL: postgres://health_travel:health_travel@localhost:5432/health_travel
      SESSION_SIGNING_KEY: ci-test-key-min-32-bytes-longer-key
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8 --no-default-features --features rustls,postgres --locked
      - name: Apply database migrations
        run: sqlx migrate run
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [service, web]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: health_travel
          POSTGRES_PASSWORD: health_travel
          POSTGRES_DB: health_travel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://health_travel:health_travel@localhost:5432/health_travel
      SESSION_SIGNING_KEY: ci-test-key-min-32-bytes-longer-key
      API_BASE_URL: http://localhost:8080
      # The Playwright browser drives the static preview on :3000 and calls the
      # API on :8080 cross-origin; allow that origin through the CORS layer and
      # the CSRF origin guard (APP_URL defaults to http://localhost:3000).
      CORS_ORIGIN: http://localhost:3000
      # Both Playwright projects (desktop + mobile) exercise the auth flows
      # against one server instance; keep the per-IP limits above the suite's
      # request count.
      RATE_LIMIT_AUTH_PER_MINUTE: '120'
      RATE_LIMIT_WRITE_PER_MINUTE: '120'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: ./web
      - name: Build server binary
        working-directory: ./service
        run: cargo build --release -p server
      - name: Seed database
        working-directory: ./service
        run: cargo run --release --bin seed
      - name: Start API server
        working-directory: ./service
        run: |
          ./target/release/server > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: Build and preview web app
        working-directory: ./web
        run: |
          npm run build
          npm run preview > /tmp/web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "API is ready"
              break
            fi
            sleep 1
          done
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Web is ready"
              break
            fi
            sleep 1
          done
      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: ./web
        run: npx playwright test
      - name: Stop background servers
        if: always()
        run: |
          kill "$SERVER_PID" "$WEB_PID" || true

  crap-check:
    runs-on: ubuntu-latest
    needs: [service]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: health_travel
          POSTGRES_PASSWORD: health_travel
          POSTGRES_DB: health_travel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://health_travel:health_travel@localhost:5432/health_travel
    defaults:
      run:
        working-directory: ./service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo install cargo-crap --version 0.4.3
      - name: CRAP check chassis crate
        run: |
          cargo llvm-cov -p chassis --lcov --output-path lcov.info
          python3 -c "
          import os, re
          p = os.getcwd() + '/'
          s = open('lcov.info').read()
          s = s.replace(p, '')
          blocks = re.split(r'(?m)^(?=SF:)', s)
          filtered = []
          for b in blocks:
              if b.startswith('SF:'):
                  path = b[3:].split('\n', 1)[0]
                  if path.startswith('/') or 'platform-templates' in path:
                      continue
              filtered.append(b)
          open('lcov.info', 'w').write(''.join(filtered))
          "
          cargo crap -p chassis --lcov lcov.info --fail-above
          cargo crap -p chassis --lcov lcov.info --baseline crates/chassis/crap_baseline.json --fail-regression

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit service dependencies (warn-only, existing advisories)
        working-directory: ./service
        continue-on-error: true
        run: |
          [ -f Cargo.lock ] || cargo generate-lockfile
          cargo audit
      - name: Audit collectors dependencies (warn-only, existing advisories)
        working-directory: ./collectors
        continue-on-error: true
        run: cargo audit
      - name: Audit web dependencies (warn-only, existing advisories)
        working-directory: ./web
        continue-on-error: true
        run: npm audit --audit-level=high

  deploy:
    needs: [service, web, crap-check, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          service/deploy/deploy.sh "health-travel-aggregator"
      - name: Clean up deploy key
        if: always()
        run: rm -f deploy_key
