name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: health_travel
          POSTGRES_PASSWORD: health_travel
          POSTGRES_DB: health_travel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: ./service
    env:
      DATABASE_URL: postgres://health_travel:health_travel@localhost:5432/health_travel
      SESSION_SIGNING_KEY: ci-test-key-min-32-bytes-longer-key
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8 --no-default-features --features rustls,postgres --locked
      - name: Apply database migrations
        run: sqlx migrate run
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  crap-check:
    runs-on: ubuntu-latest
    needs: [service]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: health_travel
          POSTGRES_PASSWORD: health_travel
          POSTGRES_DB: health_travel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://health_travel:health_travel@localhost:5432/health_travel
    defaults:
      run:
        working-directory: ./service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo install cargo-crap --version 0.4.3
      - name: CRAP check chassis crate
        run: |
          cargo llvm-cov -p chassis --lcov --output-path lcov.info
          python3 -c "
          import os, re
          p = os.getcwd() + '/'
          s = open('lcov.info').read()
          s = s.replace(p, '')
          blocks = re.split(r'(?m)^(?=SF:)', s)
          filtered = []
          for b in blocks:
              if b.startswith('SF:'):
                  path = b[3:].split('\n', 1)[0]
                  if path.startswith('/') or 'platform-templates' in path:
                      continue
              filtered.append(b)
          open('lcov.info', 'w').write(''.join(filtered))
          "
          cargo crap -p chassis --lcov lcov.info --fail-above
          cargo crap -p chassis --lcov lcov.info --baseline crates/chassis/crap_baseline.json --fail-regression

  deploy:
    needs: [service, web, crap-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          service/deploy/deploy.sh "health-travel-aggregator"
      - name: Clean up deploy key
        if: always()
        run: rm -f deploy_key
