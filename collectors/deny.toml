# cargo-deny configuration for the collectors crate.
# The allow-list below covers the permissive licenses used by the current
# dependency tree.

[advisories]
# Known advisories in the pre-existing dependency tree, mirrored by the
# warn-only `cargo audit` policy in CI. New advisories still fail the check.
ignore = [
  # chrono 0.4.45: informational "unmaintained" advisory (2026-09-14), no
  # patched version exists; the recommended replacements (jiff/time) are a
  # fleet-wide migration round, tracked separately. No known vulnerability.
  "RUSTSEC-2026-0543",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[licenses]
# Private (unpublished) crate carries no license metadata.
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
