[workspace]
resolver = "2"
members = ["crates/chassis", "crates/server"]

[workspace.dependencies]
# topcoat rev pinned by R-0 (service/SERVER_SHELL.md); `tower` feature required
# for TowerRoute (SERVER_SHELL.md static-mount idiom).
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "371c7403fcbf4d40bbacb2f87eb98d9ce00e76c8", features = ["tower"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
argon2 = "0.5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum = "0.7"
async-trait = "0.1"
