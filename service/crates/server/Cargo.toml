[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
chassis = { path = "../chassis" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# default-features off: the default "transport" pulls native-tls; this stack
# standardizes on rustls (see chassis R-3). sentry's reqwest feature currently
# pulls reqwest 0.13 — a second reqwest alongside the tree's 0.12 (build-time
# cost only, flagged by `multiple-versions = "warn"` in deny.toml).
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "release-health", "reqwest", "rustls"] }
sentry-tracing = "0.49.2"

[dev-dependencies]
tokio = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
