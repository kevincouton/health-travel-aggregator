[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
chassis = { path = "../chassis" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# Sentry error capture (workspace-managed; see the workspace entry for the
# feature set and the R-3 TLS / reqwest-0.13 note).
sentry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
