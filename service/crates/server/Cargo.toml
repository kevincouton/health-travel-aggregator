[lints.clippy]
# Google Rust Style Guide aligned lints (see ../../RUST_STYLE.md); each verified
# via `cargo clippy --workspace --all-targets -- -D warnings -W clippy::<lint>`.
wildcard_imports = "warn"
implicit_clone = "warn"
redundant_field_names = "warn"
ptr_arg = "warn"
# Guide-aligned but not yet clean (21 hits across the workspace); enable after
# a dedicated style pass.
uninlined_format_args = "allow"

[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
chassis = { path = "../chassis" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# Sentry error capture (workspace-managed; see the workspace entry for the
# feature set and the R-3 TLS / reqwest-0.13 note).
sentry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
hmac = "0.12"
sha2 = "0.11"
hex = "0.4"
