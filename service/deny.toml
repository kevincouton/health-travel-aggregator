# cargo-deny configuration for the service workspace.
# Synced from platform-templates via sync-manifest.txt; the allow-list below
# covers the permissive licenses used by the current dependency tree.

[advisories]
yanked = "deny"
# Accepted risk, still present after the openidconnect 4.0.1 / reqwest 0.12
# upgrade (rustls 0.23 / hyper 1.x / h2 0.4 — the rustls 0.21, webpki 0.101,
# h2 0.3, and rustls-pemfile ignores were cleared by that upgrade).
ignore = [
  # rsa 0.9.x (via openidconnect 4.0.1, latest 4.x): Marvin timing
  # sidechannel; no upstream fix. Verified via `cargo tree -i rsa`.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5 (via openidconnect 4.0.1 → p256/p384 → elliptic-curve
  # 0.13, latest 4.x): constant-time variability; the fix requires
  # crypto-bigint 0.7.6 + elliptic-curve 0.14, which openidconnect 4.x cannot
  # build against — same no-upstream-fix situation as rsa above. Verified via
  # `cargo tree -i crypto-bigint`.
  "RUSTSEC-2026-0387",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[licenses]
# Private (unpublished) workspace crates carry no license metadata.
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots 1.x (Mozilla roots bundle)
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-registry = "deny"
unknown-git = "deny"
