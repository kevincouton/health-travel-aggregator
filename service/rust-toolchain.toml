# The R-3 server depends on topcoat 0.5.0 (rev pinned by R-0 in
# service/SERVER_SHELL.md), whose crates declare rust-version = "1.95", so the
# service workspace builds on floating stable (1.96.1 at R-3 time). The
# template-root rust-toolchain.toml also pins floating stable since R-5
# (topcoat's 1.95 MSRV is why the root pin is not a fixed 1.xx.y); this file
# keeps the workspace self-contained when copied into a clone without the
# root file.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
