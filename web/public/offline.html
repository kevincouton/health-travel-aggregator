<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline — Health Travel</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        color: #4b5563;
        margin: 0 0 1.5rem;
        line-height: 1.6;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      a {
        color: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #030712;
          color: #f3f4f6;
        }
        p {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path
            d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z"
            fill="#fff"
            stroke="#fff"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        This page isn't available without a connection. Pages you've visited before stay readable
        offline; anything that needs your account or live data will be back once you reconnect.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p style="margin-top: 1rem"><a href="/">Back to the home page</a></p>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload()
      })
    </script>
  </body>
</html>
